name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Ensure profile directory exists
        run: mkdir -p profile

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&theme=tokyonight&border_radius=10
          path: profile/stats.svg
          token: ${{ secrets.TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&theme=tokyonight&border_radius=10
          path: profile/top-langs.svg
          token: ${{ secrets.TOKEN }}

      - name: Generate pin card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=readme-tools&repo=github-readme-stats&hide_border=true&theme=tokyonight&border_radius=10
          path: profile/pin-readme-tools-github-readme-stats.svg
          token: ${{ secrets.TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f profile/streak.svg

          git add -A profile

          git diff --cached --quiet && exit 0

          git commit -m "Update README cards"
          git push